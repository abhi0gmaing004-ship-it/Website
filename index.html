<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satyam GPT AI</title>
<style>
  :root{
    --ink:#1c1b1a;
    --paper:#efe9df;
    --paper-raised:#f7f3ea;
    --rule:#c9c0af;
    --moss:#3f5d4a;
    --moss-deep:#28402f;
    --clay:#a8552e;
    --font-display:'Georgia', 'Iowan Old Style', serif;
    --font-body:'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:var(--font-body);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header{
    position:sticky;
    top:0;
    z-index:10;
    padding:18px 20px;
    text-align:left;
    border-bottom:1px solid var(--rule);
    background:rgba(239,233,223,0.92);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    gap:12px;
    max-width:760px;
    margin:0 auto;
  }
  header .mark{
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:50%;
    background:var(--moss-deep);
    color:var(--paper-raised);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:17px;
  }
  header .titles{display:flex; flex-direction:column;}
  header h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(20px,4vw,24px);
    margin:0;
    letter-spacing:0.3px;
    color:var(--moss-deep);
  }
  header p{
    margin:2px 0 0;
    font-size:12.5px;
    color:#847c6d;
  }

  main{
    flex:1;
    max-width:760px;
    width:100%;
    margin:0 auto;
    padding:24px 16px 140px;
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow-y:auto;
  }

  .row{display:flex; gap:12px; align-items:flex-start;}
  .row.user{flex-direction:row-reverse;}

  .badge{
    flex:0 0 auto;
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:15px;
    color:var(--paper-raised);
  }
  .row.ai .badge{background:var(--moss);}
  .row.user .badge{background:var(--clay);}

  .bubble{
    max-width:80%;
    padding:13px 16px;
    line-height:1.55;
    font-size:15.5px;
    border:1px solid var(--rule);
    background:var(--paper-raised);
    white-space:pre-wrap;
    box-shadow:0 1px 2px rgba(28,27,26,0.06);
  }
  .row.ai .bubble{border-radius:2px 14px 14px 14px;}
  .row.user .bubble{border-radius:14px 2px 14px 14px; background:#f2e4d8;}

  .row.ai .bubble.thinking{
    color:#8a8375;
    font-style:italic;
  }

  .welcome{
    text-align:center;
    color:#847c6d;
    font-size:14px;
    padding:52px 20px;
    border:1px dashed var(--rule);
  }
  .welcome .mark{
    width:44px;height:44px;
    margin:0 auto 14px;
    border-radius:50%;
    background:var(--moss-deep);
    color:var(--paper-raised);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:19px;
  }

  footer.credit{
    text-align:center;
    font-size:12px;
    color:#a19a8c;
    padding:6px 0 0;
  }

  form{
    position:fixed;
    bottom:0; left:0; right:0;
    background:linear-gradient(to top, var(--paper) 60%, transparent);
    padding:22px 16px 8px;
  }
  .input-wrap{
    max-width:760px;
    margin:0 auto;
    display:flex;
    gap:10px;
    background:var(--paper-raised);
    border:1px solid var(--ink);
    padding:6px 6px 6px 16px;
    box-shadow:0 2px 10px rgba(28,27,26,0.08);
  }
  textarea{
    flex:1;
    border:none;
    background:transparent;
    resize:none;
    font-family:var(--font-body);
    font-size:15.5px;
    line-height:1.5;
    padding:10px 0;
    max-height:140px;
    color:var(--ink);
  }
  textarea:focus{outline:none;}
  button{
    flex:0 0 auto;
    background:var(--moss-deep);
    color:var(--paper-raised);
    border:none;
    padding:0 20px;
    font-family:var(--font-display);
    font-size:15px;
    cursor:pointer;
    transition:background 0.15s ease;
    display:flex;
    align-items:center;
    gap:7px;
  }
  button svg{width:15px;height:15px;flex:0 0 auto;}
  button:hover{background:var(--moss);}
  button:disabled{background:#a7a196; cursor:not-allowed;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--rule);}
</style>
</head>
<body>

<header>
  <div class="mark">S</div>
  <div class="titles">
    <h1>Satyam GPT AI</h1>
    <p>bina login, bina limit — jo poochna hai poocho</p>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <div class="mark">S</div>
    Kuch bhi poochho — neeche type karke shuru karo.
  </div>
</main>

<form id="form">
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Apna sawaal likho..." autofocus></textarea>
    <button type="submit" id="send">
      <span>Bhejo</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
  <footer class="credit">Satyam dwara banaya gaya</footer>
</form>

<script>
  const chat = document.getElementById('chat');
  const welcome = document.getElementById('welcome');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  function addBubble(role, text) {
    if (welcome) welcome.remove();
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'ai');
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = role === 'user' ? 'Tu' : 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(role === 'user' ? bubble : badge);
    row.appendChild(role === 'user' ? badge : bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addBubble('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const aiBubble = addBubble('ai', '');
    aiBubble.classList.add('thinking');
    aiBubble.textContent = 'soch raha hu...';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      const data = await res.json();

      aiBubble.classList.remove('thinking');

      if (!res.ok) {
        aiBubble.textContent = data.error || 'Kuch gadbad ho gayi.';
      } else {
        aiBubble.textContent = data.reply;
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (err) {
      aiBubble.classList.remove('thinking');
      aiBubble.textContent = 'Server tak pahunch nahi paaya. Dobara try karo.';
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
