<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satyam GPT AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#0b0e14;
    --surface:#141922;
    --surface-2:#1b212c;
    --border:#262d3a;
    --text:#e8eaf0;
    --text-dim:#8b93a3;
    --accent:#d4a95c;
    --accent-contrast:#0b0e14;
    --user-bubble:#202838;
    --danger:#e0685f;
  }
  :root[data-theme="pink"]{
    --bg:#fff5f7;
    --surface:#ffffff;
    --surface-2:#ffe9ee;
    --border:#f3c9d4;
    --text:#3a1f28;
    --text-dim:#93707c;
    --accent:#e8607f;
    --accent-contrast:#ffffff;
    --user-bubble:#ffdde5;
    --danger:#d94b4b;
  }
  :root[data-theme="light"]{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#eef0f4;
    --border:#dfe3ea;
    --text:#1a1d23;
    --text-dim:#6b7280;
    --accent:#4f46e5;
    --accent-contrast:#ffffff;
    --user-bubble:#e8e7fc;
    --danger:#dc4747;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    display:flex;
    min-height:100vh;
    font-size:var(--fs-base, 15.5px);
    transition:background 0.2s ease, color 0.2s ease;
  }
  [data-size="sm"]{--fs-base:14px;}
  [data-size="md"]{--fs-base:15.5px;}
  [data-size="lg"]{--fs-base:17px;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:264px;
    flex:0 0 auto;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    height:100vh;
    position:fixed;
    left:0; top:0;
    transform:translateX(-100%);
    transition:transform 0.25s ease;
    z-index:30;
  }
  #sidebar.open{transform:translateX(0);}
  @media(min-width:900px){
    #sidebar{position:sticky; transform:none;}
    #overlay{display:none !important;}
  }
  #overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.4);
    z-index:20;
  }
  #overlay.open{display:block;}

  .sidebar-top{padding:16px; border-bottom:1px solid var(--border);}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .brand .mark{
    width:32px;height:32px;border-radius:9px;
    background:var(--accent); color:var(--accent-contrast);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
  }
  .brand span{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px;}

  #new-chat-btn{
    width:100%;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:9px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  #new-chat-btn:hover{border-color:var(--accent); background:var(--surface-2);}
  #new-chat-btn svg{width:15px;height:15px;}

  .sidebar-label{
    padding:14px 16px 6px;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--text-dim);
  }
  #history-list{
    flex:1;
    overflow-y:auto;
    padding:0 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .history-item{
    padding:9px 10px;
    border-radius:8px;
    font-size:13.5px;
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .history-item:hover{background:var(--surface-2); color:var(--text);}
  .history-item.active{background:var(--surface-2); color:var(--text);}
  .history-empty{
    padding:10px; font-size:13px; color:var(--text-dim); font-style:italic;
  }

  .sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border);
  }
  #settings-btn{
    width:100%;
    background:transparent;
    border:none;
    color:var(--text-dim);
    padding:9px 8px;
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    cursor:pointer;
    display:flex; align-items:center; gap:9px;
    transition:background 0.15s ease, color 0.15s ease;
  }
  #settings-btn:hover{background:var(--surface-2); color:var(--text);}
  #settings-btn svg{width:16px;height:16px;}

  /* ---------- Main ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100vh;
  }
  #topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  #menu-btn{
    display:flex;
    background:transparent; border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:7px;
    cursor:pointer;
  }
  #menu-btn svg{width:17px;height:17px;display:block;}
  @media(min-width:900px){ #menu-btn{display:none;} }
  #topbar h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:600;
    margin:0;
  }

  #chat{
    flex:1;
    overflow-y:auto;
    padding:24px 18px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  #chat-inner{max-width:720px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:16px;}

  .row{display:flex; gap:11px; align-items:flex-start; max-width:100%;}
  .row.user{flex-direction:row-reverse;}
  .row-badge{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:12px;
  }
  .row.ai .row-badge{background:var(--accent); color:var(--accent-contrast);}
  .row.user .row-badge{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}

  .bubble{
    max-width:78%;
    padding:12px 15px;
    line-height:1.6;
    border-radius:13px;
    white-space:pre-wrap;
    border:1px solid var(--border);
  }
  .row.ai .bubble{background:var(--surface); border-top-left-radius:3px;}
  .row.user .bubble{background:var(--user-bubble); border-top-right-radius:3px;}
  .bubble.thinking{color:var(--text-dim); font-style:italic;}

  .welcome{
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    padding:60px 20px;
    max-width:720px;
    margin:0 auto;
  }
  .welcome .mark{
    width:46px;height:46px;margin:0 auto 16px;
    border-radius:13px;
    background:var(--accent); color:var(--accent-contrast);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;
  }
  .welcome h2{
    font-family:'Space Grotesk',sans-serif;
    color:var(--text);
    font-size:19px;
    font-weight:600;
    margin:0 0 6px;
  }

  /* ---------- Input dock ---------- */
  #dock{
    padding:14px 18px 18px;
    border-top:1px solid var(--border);
    background:var(--bg);
  }
  .input-wrap{
    max-width:720px;
    margin:0 auto;
    display:flex;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:13px;
    padding:6px 6px 6px 15px;
  }
  .input-wrap:focus-within{border-color:var(--accent);}
  textarea{
    flex:1;
    border:none;
    background:transparent;
    resize:none;
    font-family:inherit;
    font-size:var(--fs-base);
    line-height:1.5;
    padding:9px 0;
    max-height:140px;
    color:var(--text);
  }
  textarea::placeholder{color:var(--text-dim);}
  textarea:focus{outline:none;}
  #send-btn{
    flex:0 0 auto;
    background:var(--accent);
    color:var(--accent-contrast);
    border:none;
    padding:0 18px;
    border-radius:9px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:opacity 0.15s ease;
  }
  #send-btn:hover{opacity:0.85;}
  #send-btn:disabled{opacity:0.4; cursor:not-allowed;}
  #send-btn svg{width:14px;height:14px;}

  .credit{
    text-align:center; font-size:11.5px; color:var(--text-dim);
    padding-top:9px;
  }

  /* ---------- Settings modal ---------- */
  #settings-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.45);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  #settings-overlay.open{display:flex;}
  #settings-panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    width:100%;
    max-width:380px;
    padding:22px;
  }
  #settings-panel h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    margin:0 0 18px;
  }
  .settings-group{margin-bottom:18px;}
  .settings-group label.group-label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .theme-options{display:flex; gap:10px;}
  .theme-swatch{
    flex:1;
    border:2px solid var(--border);
    border-radius:10px;
    padding:10px 6px;
    text-align:center;
    cursor:pointer;
    font-size:11.5px;
    color:var(--text-dim);
    background:var(--surface-2);
  }
  .theme-swatch.active{border-color:var(--accent); color:var(--text);}
  .theme-swatch .dot{
    width:20px;height:20px;border-radius:50%;
    margin:0 auto 6px;
  }
  .size-options{display:flex; gap:8px;}
  .size-btn{
    flex:1;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-dim);
    border-radius:8px;
    padding:8px 0;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .size-btn.active{border-color:var(--accent); color:var(--text);}
  #clear-history-btn{
    width:100%;
    background:transparent;
    border:1px solid var(--danger);
    color:var(--danger);
    padding:10px;
    border-radius:9px;
    font-size:13.5px;
    font-family:inherit;
    cursor:pointer;
  }
  #close-settings{
    width:100%;
    margin-top:16px;
    background:var(--accent);
    color:var(--accent-contrast);
    border:none;
    padding:10px;
    border-radius:9px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>
<body data-theme="dark" data-size="md">

<div id="overlay"></div>

<aside id="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <div class="mark">S</div>
      <span>Satyam GPT AI</span>
    </div>
    <button id="new-chat-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New chat
    </button>
  </div>
  <div class="sidebar-label">Recent</div>
  <div id="history-list"></div>
  <div class="sidebar-bottom">
    <button id="settings-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      Settings
    </button>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <button id="menu-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <h1 id="chat-title">New chat</h1>
  </div>

  <div id="chat"><div id="chat-inner"></div></div>

  <div id="dock">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Type your message..." autofocus></textarea>
      <button id="send-btn">
        <span>Send</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
    <div class="credit">Built by Satyam</div>
  </div>
</div>

<div id="settings-overlay">
  <div id="settings-panel">
    <h3>Settings</h3>

    <div class="settings-group">
      <label class="group-label">Theme</label>
      <div class="theme-options" id="theme-options">
        <div class="theme-swatch" data-theme-choice="dark">
          <div class="dot" style="background:#0b0e14; border:1px solid #d4a95c;"></div>
          Dark Tech
        </div>
        <div class="theme-swatch" data-theme-choice="pink">
          <div class="dot" style="background:#ffe9ee; border:1px solid #e8607f;"></div>
          Soft Pink
        </div>
        <div class="theme-swatch" data-theme-choice="light">
          <div class="dot" style="background:#f5f6f8; border:1px solid #4f46e5;"></div>
          Clean Light
        </div>
      </div>
    </div>

    <div class="settings-group">
      <label class="group-label">Text size</label>
      <div class="size-options" id="size-options">
        <div class="size-btn" data-size-choice="sm">Small</div>
        <div class="size-btn" data-size-choice="md">Medium</div>
        <div class="size-btn" data-size-choice="lg">Large</div>
      </div>
    </div>

    <div class="settings-group">
      <label class="group-label">Data</label>
      <button id="clear-history-btn">Clear all conversation history</button>
    </div>

    <button id="close-settings">Done</button>
  </div>
</div>

<script>
  const STORAGE_KEYS = {
    conversations: 'satyamgpt_conversations',
    theme: 'satyamgpt_theme',
    size: 'satyamgpt_size',
  };
  const MAX_CONVERSATIONS = 5;

  const chatInner = document.getElementById('chat-inner');
  const chatEl = document.getElementById('chat');
  const chatTitle = document.getElementById('chat-title');
  const historyList = document.getElementById('history-list');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuBtn = document.getElementById('menu-btn');
  const newChatBtn = document.getElementById('new-chat-btn');
  const settingsBtn = document.getElementById('settings-btn');
  const settingsOverlay = document.getElementById('settings-overlay');
  const closeSettings = document.getElementById('close-settings');
  const clearHistoryBtn = document.getElementById('clear-history-btn');

  let conversations = loadConversations();
  let currentId = null;
  let currentMessages = [];

  function loadConversations() {
    try {
      const raw = localStorage.getItem(STORAGE_KEYS.conversations);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }
  function saveConversations() {
    conversations.sort((a, b) => b.updatedAt - a.updatedAt);
    conversations = conversations.slice(0, MAX_CONVERSATIONS);
    localStorage.setItem(STORAGE_KEYS.conversations, JSON.stringify(conversations));
  }

  function renderHistory() {
    historyList.innerHTML = '';
    if (conversations.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = 'No conversations yet';
      historyList.appendChild(empty);
      return;
    }
    conversations.forEach(conv => {
      const item = document.createElement('div');
      item.className = 'history-item' + (conv.id === currentId ? ' active' : '');
      item.textContent = conv.title;
      item.addEventListener('click', () => {
        loadConversation(conv.id);
        closeSidebarMobile();
      });
      historyList.appendChild(item);
    });
  }

  function startNewChat() {
    currentId = null;
    currentMessages = [];
    chatInner.innerHTML = '';
    chatTitle.textContent = 'New chat';
    showWelcome();
    renderHistory();
  }

  function loadConversation(id) {
    const conv = conversations.find(c => c.id === id);
    if (!conv) return;
    currentId = conv.id;
    currentMessages = conv.messages.slice();
    chatInner.innerHTML = '';
    chatTitle.textContent = conv.title;
    currentMessages.forEach(m => addBubble(m.role === 'user' ? 'user' : 'ai', m.content));
    renderHistory();
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showWelcome() {
    const div = document.createElement('div');
    div.className = 'welcome';
    div.innerHTML = '<div class="mark">S</div><h2>Satyam GPT AI</h2><p>Ask anything to get started.</p>';
    chatInner.appendChild(div);
  }

  function addBubble(role, text) {
    const existingWelcome = chatInner.querySelector('.welcome');
    if (existingWelcome) existingWelcome.remove();

    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'ai');
    const badge = document.createElement('div');
    badge.className = 'row-badge';
    badge.textContent = role === 'user' ? 'You' : 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(role === 'user' ? bubble : badge);
    row.appendChild(role === 'user' ? badge : bubble);
    chatInner.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function persistCurrentConversation() {
    if (currentMessages.length === 0) return;
    if (!currentId) {
      currentId = 'c_' + Date.now();
      const firstUserMsg = currentMessages.find(m => m.role === 'user');
      const title = firstUserMsg ? firstUserMsg.content.slice(0, 34) + (firstUserMsg.content.length > 34 ? '…' : '') : 'New chat';
      conversations.push({ id: currentId, title, messages: currentMessages, updatedAt: Date.now() });
      chatTitle.textContent = title;
    } else {
      const conv = conversations.find(c => c.id === currentId);
      if (conv) {
        conv.messages = currentMessages;
        conv.updatedAt = Date.now();
      }
    }
    saveConversations();
    renderHistory();
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addBubble('user', text);
    currentMessages.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const aiBubble = addBubble('ai', '');
    aiBubble.classList.add('thinking');
    aiBubble.textContent = 'Thinking...';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: currentMessages }),
      });
      const data = await res.json();
      aiBubble.classList.remove('thinking');

      if (!res.ok) {
        aiBubble.textContent = data.error || 'Something went wrong.';
      } else {
        aiBubble.textContent = data.reply;
        currentMessages.push({ role: 'assistant', content: data.reply });
        persistCurrentConversation();
      }
    } catch (err) {
      aiBubble.classList.remove('thinking');
      aiBubble.textContent = 'Could not reach the server. Please try again.';
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // Sidebar mobile toggle
  function openSidebarMobile() { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebarMobile() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
  menuBtn.addEventListener('click', openSidebarMobile);
  overlay.addEventListener('click', closeSidebarMobile);
  newChatBtn.addEventListener('click', () => { startNewChat(); closeSidebarMobile(); });

  // Settings
  function applyTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-swatch').forEach(el => {
      el.classList.toggle('active', el.dataset.themeChoice === theme);
    });
    localStorage.setItem(STORAGE_KEYS.theme, theme);
  }
  function applySize(size) {
    document.body.setAttribute('data-size', size);
    document.querySelectorAll('.size-btn').forEach(el => {
      el.classList.toggle('active', el.dataset.sizeChoice === size);
    });
    localStorage.setItem(STORAGE_KEYS.size, size);
  }

  document.querySelectorAll('.theme-swatch').forEach(el => {
    el.addEventListener('click', () => applyTheme(el.dataset.themeChoice));
  });
  document.querySelectorAll('.size-btn').forEach(el => {
    el.addEventListener('click', () => applySize(el.dataset.sizeChoice));
  });

  settingsBtn.addEventListener('click', () => { settingsOverlay.classList.add('open'); closeSidebarMobile(); });
  closeSettings.addEventListener('click', () => settingsOverlay.classList.remove('open'));
  settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

  clearHistoryBtn.addEventListener('click', () => {
    if (!confirm('Delete all saved conversations? This cannot be undone.')) return;
    conversations = [];
    localStorage.removeItem(STORAGE_KEYS.conversations);
    startNewChat();
  });

  // Init
  const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || 'dark';
  const savedSize = localStorage.getItem(STORAGE_KEYS.size) || 'md';
  applyTheme(savedTheme);
  applySize(savedSize);
  startNewChat();
</script>

</body>
</html>
